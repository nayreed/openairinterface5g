name: oai-amber image

# Builds the image with amber-reader, amber-tag and Amber (docker/Dockerfile.amber.ubuntu), runs
# two test scenarios and Amber's four demos from it in docker compose and compares their logs with
# one-process Amber, then publishes it as ghcr.io/<owner>/oai-amber:<commit>, and :latest for the aiot-rfsim branch.

on:
  push:
    branches: [aiot-rfsim, amber-toml-integration]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: amber-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Name the image
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oai-amber" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - name: Validate AMBER campaign tooling
        run: |
          bash -n docker/scripts/amber_campaign.sh docker/scripts/amber_check_image.sh
          python3 -m py_compile docker/scripts/amber_compose.py

      - name: Build
        run: |
          docker build -f docker/Dockerfile.amber.ubuntu \
            --build-arg OAI_AMBER_IMAGE="$IMAGE:$TAG" \
            -t "$IMAGE:$TAG" .
          docker image ls "$IMAGE"

      - name: Run 4 Tags and compare with one process
        run: docker/scripts/amber_check_image.sh "$IMAGE:$TAG" /opt/amber/tests/split/scenarios/registration.py

      - name: Run 12 Tags and compare with one process
        run: docker/scripts/amber_check_image.sh "$IMAGE:$TAG" /opt/amber/tests/split/scenarios/adaptive_aloha.py

      - name: Run Amber's broadcast demo and compare with one process
        run: docker/scripts/amber_check_image.sh "$IMAGE:$TAG" /opt/amber/demo_experiments/split/broadcast.py

      - name: Run Amber's broadcast_sic demo and compare with one process
        run: docker/scripts/amber_check_image.sh "$IMAGE:$TAG" /opt/amber/demo_experiments/split/broadcast_sic.py

      - name: Run Amber's unicast demo and compare with one process
        run: docker/scripts/amber_check_image.sh "$IMAGE:$TAG" /opt/amber/demo_experiments/split/unicast.py

      - name: Run Amber's custom_protocol demo and compare with one process
        run: docker/scripts/amber_check_image.sh "$IMAGE:$TAG" /opt/amber/demo_experiments/split/custom_protocol.py

      - name: Run seeded TOML registration scenario and compare with one process
        run: docker/scripts/amber_check_image.sh "$IMAGE:$TAG" /opt/amber/tests/split/scenarios/registration.toml

      - name: Run seeded 12-Tag TOML adaptive ALOHA scenario and compare with one process
        run: docker/scripts/amber_check_image.sh "$IMAGE:$TAG" /opt/amber/tests/split/scenarios/adaptive_aloha.toml

      - name: Run Amber TOML broadcast demo and compare with one process
        run: docker/scripts/amber_check_image.sh "$IMAGE:$TAG" /opt/amber/demo_experiments/broadcast/broadcast.toml

      - name: Run Amber TOML broadcast SIC demo and compare with one process
        run: docker/scripts/amber_check_image.sh "$IMAGE:$TAG" /opt/amber/demo_experiments/broadcast_sic/broadcast_sic.toml

      - name: Run Amber TOML unicast demo and compare with one process
        run: docker/scripts/amber_check_image.sh "$IMAGE:$TAG" /opt/amber/demo_experiments/unicast/unicast.toml

      - name: Run Amber TOML custom protocol demo and compare with one process
        run: docker/scripts/amber_check_image.sh "$IMAGE:$TAG" /opt/amber/demo_experiments/custom_protocol/custom_protocol.toml

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$TAG"
          if [ "$GITHUB_REF" = refs/heads/aiot-rfsim ]; then
            docker tag "$IMAGE:$TAG" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

name: oai-amber image

# Builds oai-amber (amber-reader, amber-tag, rfsim_hub and Amber's dev branch, from
# docker/Dockerfile.amber.ubuntu), checks it, runs every checked-in 5G room with it, and only then
# publishes it. The gNB and UE images come from the oai-gnb and oai-nr-ue workflow
# (oai-5g-images.yml); this workflow pulls them and never builds them.
#
# It never starts on a push or a pull request. The oai-gnb and oai-nr-ue workflow starts it once it
# has pushed a new gNB and UE (oai_5g_tag=<commit>); start it by hand with oai_5g_tag=latest to run
# the rooms with the :latest gNB and UE.
#
#   gnb-ue     the oai-gnb and oai-nr-ue to run the rooms with (:<oai_5g_tag>); nothing else runs
#              without them
#   scripts    bash -n and shellcheck on the scripts the images and rooms use
#   build      the oai-amber image, from the GitHub Actions layer cache
#   scenarios  two seeded Amber scenarios in docker compose, compared with amber.run
#   rooms      each room in ci-scripts/yaml_files/5g_rfsimulator_aiot* with those three images
#              (docker/scripts/aiot_check_room.sh)
#   publish    on aiot-rfsim, once the rooms pass: oai-amber as :<commit> and :latest, and the gNB
#              and UE the rooms ran with as :latest
#
# On another branch everything but publish runs. A room then runs from the published images with
#   REGISTRY=ghcr.io/<owner>/ TAG=latest AMBER_IMG=ghcr.io/<owner>/oai-amber:latest docker compose up -d

on:
  workflow_dispatch:
    inputs:
      oai_5g_tag:
        description: oai-gnb and oai-nr-ue tag to run the rooms with (the oai-gnb and oai-nr-ue workflow passes its commit)
        default: latest

permissions:
  contents: read

# A run with a new gNB and UE has a group of its own, so a later run with :latest does not cancel
# the run that would move the gNB and UE to :latest.
concurrency:
  group: amber-image-${{ github.ref }}-${{ inputs.oai_5g_tag || 'latest' }}
  cancel-in-progress: true

jobs:
  gnb-ue:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - name: Find oai-gnb and oai-nr-ue
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.oai_5g_tag || 'latest' }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          for name in oai-gnb oai-nr-ue; do
            if ! docker manifest inspect "$registry/$name:$TAG" > /dev/null 2>&1; then
              echo "$registry/$name:$TAG does not exist: run the oai-gnb and oai-nr-ue workflow first" >&2
              exit 1
            fi
          done

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check the scripts
        run: |
          bash -n docker/scripts/amber_campaign.sh
          bash -n docker/scripts/amber_check_image.sh
          bash -n docker/scripts/aiot_check_room.sh
          shellcheck -S warning docker/scripts/amber_campaign.sh docker/scripts/amber_check_image.sh \
            docker/scripts/aiot_check_room.sh
          python3 -m py_compile docker/scripts/amber_compose.py

  build:
    needs: [scripts, gnb-ue]
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.name.outputs.image }}
      tag: ${{ steps.name.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Name the image and pick Amber's dev commit
        id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oai-amber:${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          amber=$(git ls-remote https://github.com/nayreed/Amber refs/heads/dev | cut -f1)
          [ -n "$amber" ] || { echo "Amber has no dev branch" >&2; exit 1; }
          echo "amber=$amber" >> "$GITHUB_OUTPUT"
          echo "Amber dev is at $amber"
      - uses: docker/setup-buildx-action@v4
      # The dependency layers come from the GitHub Actions cache; only the Amber clone (when dev
      # moved) and the OAI build run again.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.amber.ubuntu
          build-args: |
            AMBER_REF=${{ steps.name.outputs.amber }}
            OAI_AMBER_IMAGE=${{ steps.name.outputs.image }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.name.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=${{ runner.temp }}/oai-amber.tar
      - uses: actions/upload-artifact@v7
        with:
          name: oai-amber
          path: ${{ runner.temp }}/oai-amber.tar
          retention-days: 1

  scenarios:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - /opt/amber/tests/scenarios/adaptive_aloha.toml
          - /opt/amber/tests/scenarios/gen2_q.toml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: oai-amber
          path: ${{ runner.temp }}
      - name: Load the image
        run: docker load --input "$RUNNER_TEMP/oai-amber.tar"
      - name: Run the scenario in containers and compare with amber.run
        run: docker/scripts/amber_check_image.sh "${{ needs.build.outputs.image }}" "${{ matrix.scenario }}"

  # Each checked-in 5G room: every Tag heard, the cell without errors, a ping through, and each
  # room's own check (see aiot_check_room.sh). The records and logs are kept as an artifact, pass
  # or fail.
  rooms:
    needs: [build, gnb-ue]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        room:
          - 5g_rfsimulator_aiot
          - 5g_rfsimulator_aiot_t1
          - 5g_rfsimulator_aiot_t1_cw_ul
          - 5g_rfsimulator_aiot_t2
          - 5g_rfsimulator_aiot_t3a
          - 5g_rfsimulator_aiot_t3b
          - 5g_rfsimulator_aiot_t4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: oai-amber
          path: ${{ runner.temp }}
      - name: Get the images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.gnb-ue.outputs.tag }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}
          docker pull "$registry/oai-gnb:$TAG"
          docker pull "$registry/oai-nr-ue:$TAG"
          docker load --input "$RUNNER_TEMP/oai-amber.tar"
      - name: Run the room and check it
        env:
          TAG: ${{ needs.gnb-ue.outputs.tag }}
          AMBER_IMG: ${{ needs.build.outputs.image }}
        run: |
          export REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/
          docker/scripts/aiot_check_room.sh "ci-scripts/yaml_files/${{ matrix.room }}" "$RUNNER_TEMP/room"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: room-${{ matrix.room }}
          path: ${{ runner.temp }}/room
          retention-days: 14

  # Nothing is published unless every room passed with these images.
  publish:
    needs: [build, scenarios, gnb-ue, rooms]
    if: github.ref == 'refs/heads/aiot-rfsim'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: oai-amber
          path: ${{ runner.temp }}
      - name: Push oai-amber, and move the gNB and UE to :latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AMBER: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
          OAI_5G_TAG: ${{ needs.gnb-ue.outputs.tag }}
        run: |
          registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker load --input "$RUNNER_TEMP/oai-amber.tar"
          docker push "$AMBER"
          docker tag "$AMBER" "$registry/oai-amber:latest"
          docker push "$registry/oai-amber:latest"
          if [ "$OAI_5G_TAG" != latest ]; then
            for name in oai-gnb oai-nr-ue; do
              docker buildx imagetools create --tag "$registry/$name:latest" "$registry/$name:$OAI_5G_TAG"
            done
          fi

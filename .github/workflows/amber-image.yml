name: oai-amber image

# Started by hand (Actions > oai-amber image > Run workflow). Builds the image with amber-reader,
# amber-tag and Amber's current dev branch (docker/Dockerfile.amber.ubuntu), runs two seeded TOML
# scenarios from it in docker compose on one runner and compares their CSV files with amber.run,
# then, on aiot-rfsim only, publishes it as ghcr.io/<owner>/oai-amber:<commit> and :latest.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amber-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the scripts
        run: |
          bash -n docker/scripts/amber_campaign.sh
          bash -n docker/scripts/amber_check_image.sh
          shellcheck -S warning docker/scripts/amber_campaign.sh docker/scripts/amber_check_image.sh
          python3 -m py_compile docker/scripts/amber_compose.py

  build:
    needs: scripts
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Name the image and pick Amber's dev commit
        id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oai-amber:${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          amber=$(git ls-remote https://github.com/nayreed/Amber refs/heads/dev | cut -f1)
          [ -n "$amber" ] || { echo "Amber has no dev branch" >&2; exit 1; }
          echo "amber=$amber" >> "$GITHUB_OUTPUT"
          echo "Amber dev is at $amber"
      - uses: docker/setup-buildx-action@v3
      # The dependency layers come from the GitHub Actions cache; only the Amber clone (when dev
      # moved) and the OAI build run again.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.amber.ubuntu
          build-args: |
            AMBER_REF=${{ steps.name.outputs.amber }}
            OAI_AMBER_IMAGE=${{ steps.name.outputs.image }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.name.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=${{ runner.temp }}/oai-amber.tar
      - uses: actions/upload-artifact@v4
        with:
          name: oai-amber
          path: ${{ runner.temp }}/oai-amber.tar
          retention-days: 1

  scenarios:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - /opt/amber/tests/scenarios/registration.toml
          - /opt/amber/tests/scenarios/adaptive_aloha.toml
          - /opt/amber/tests/scenarios/gen2_q_iq.toml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: oai-amber
          path: ${{ runner.temp }}
      - name: Load the image
        run: docker load --input "$RUNNER_TEMP/oai-amber.tar"
      - name: Run the scenario in containers and compare with amber.run
        run: docker/scripts/amber_check_image.sh "${{ needs.build.outputs.image }}" "${{ matrix.scenario }}"

  publish:
    needs: [build, scenarios]
    if: github.ref == 'refs/heads/aiot-rfsim'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: oai-amber
          path: ${{ runner.temp }}
      - name: Push to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker load --input "$RUNNER_TEMP/oai-amber.tar"
          image=${{ needs.build.outputs.image }}
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$image"
          docker tag "$image" "${image%:*}:latest"
          docker push "${image%:*}:latest"

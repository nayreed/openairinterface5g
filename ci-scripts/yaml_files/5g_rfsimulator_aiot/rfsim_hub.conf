# SPDX-License-Identifier: LicenseRef-CSSL-1.0
# Written by amber-compose from "/room/scenario.toml"
#
# rfsim_hub room: the 25-PRB n8 cell of gnb.conf (gNB) and nr-ue.conf (UE) and an
# Ambient IoT Reader with 4 Tags, all at 5.76 Msps. The gNB leaves DL PRBs 0-2 and UL PRBs 15-21
# free (dl_prbblacklist, ul_prbblacklist), and the links put the A-IoT carrier there.
# README.md next to this file explains the gains, and radio/rfsimulator/hub/README.md the parameters.

rfsim_hub = {
  sample_rate = 5760000.0;
  quantum = 1440;
  history = 262144;
  idle_timeout = 60.0;

  nodes = (
    # sl_ahead (6 slots) ahead, and its first write comes after its first read
    { name = "gnb";    port = 4043; lookahead = 34560; lead = 1; },
    # the UE's rx-to-tx distance
    { name = "ue";     port = 4044; lookahead = 17024; lead = 1; },
    # amber-reader writes block n, then reads block n
    { name = "reader"; port = 4050; lookahead = 5760; },
    # amber-tag reads block n, then answers it
    { name = "tag0";   port = 4051; lookahead = 0; },
    { name = "tag1";   port = 4052; lookahead = 0; },
    { name = "tag2";   port = 4053; lookahead = 0; },
    { name = "tag3";   port = 4054; lookahead = 0; }
  );

  links = (
    # the 5G cell
    { tx = "gnb"; rx = "ue"; },
    { tx = "ue"; rx = "gnb"; },

    # A-IoT: 0 dB, Amber applies its own path loss
    { tx = "reader"; rx = "tag0"; },
    { tx = "reader"; rx = "tag1"; },
    { tx = "reader"; rx = "tag2"; },
    { tx = "reader"; rx = "tag3"; },
    { tx = "tag0"; rx = "reader"; },
    { tx = "tag1"; rx = "reader"; },
    { tx = "tag2"; rx = "reader"; },
    { tx = "tag3"; rx = "reader"; },

    # Between the 5G cell and the A-IoT link, gains from where [network] places the gNB and the UE
    # (amber.coexist: TR 38.769 Table 6.6.2.1-1). The Reader in DL PRBs 0-2 (PRB 1's centre) at the UE
    { tx = "reader"; rx = "ue"; gain_dB = -43.12; shift_Hz = -1980000.0; },
    # the 5G DL at each Tag
    { tx = "gnb"; rx = "tag0"; gain_dB = -12.89; shift_Hz = 1980000.0; },
    { tx = "gnb"; rx = "tag1"; gain_dB = -8.62; shift_Hz = 1980000.0; },
    { tx = "gnb"; rx = "tag2"; gain_dB = -8.84; shift_Hz = 1980000.0; },
    { tx = "gnb"; rx = "tag3"; gain_dB = -7.67; shift_Hz = 1980000.0; },
    # each Tag's D2R at the gNB, in UL PRBs 15-21 (PRB 18's centre)
    { tx = "tag0"; rx = "gnb"; gain_dB = -61.7; shift_Hz = 1080000.0; },
    { tx = "tag1"; rx = "gnb"; gain_dB = -57.43; shift_Hz = 1080000.0; },
    { tx = "tag2"; rx = "gnb"; gain_dB = -57.64; shift_Hz = 1080000.0; },
    { tx = "tag3"; rx = "gnb"; gain_dB = -56.48; shift_Hz = 1080000.0; },
    # the Reader's carrier in the UL band, at the gNB
    { tx = "reader"; rx = "gnb"; gain_dB = -16.09; shift_Hz = 1080000.0; },
    # the UE's UL at the Reader
    { tx = "ue"; rx = "reader"; gain_dB = 4.88; shift_Hz = -1080000.0; }
  );
};

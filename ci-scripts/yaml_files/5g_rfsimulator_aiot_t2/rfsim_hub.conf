# SPDX-License-Identifier: LicenseRef-CSSL-1.0
# Written by amber-compose from "/room/scenario.toml"
#
# rfsim_hub room, topology 2: the 25-PRB n28 cell of gnb.conf (gNB) and nr-ue.conf (UE), the UE
# the Ambient IoT Reader of 4 Tags, all at 5.76 Msps. The UE sends the R2D in UL PRBs 12-14,
# a CW node the carrier at UL PRB 18, and the UE receives the D2R in the guard band of its DL.
# The gNB leaves UL PRBs 12-21 free (ul_prbblacklist).
# README.md next to this file explains the gains, and radio/rfsimulator/hub/README.md the parameters.

rfsim_hub = {
  sample_rate = 5760000.0;
  quantum = 1440;
  history = 262144;
  idle_timeout = 60.0;

  nodes = (
    # sl_ahead (6 slots) ahead, and its first write comes after its first read
    { name = "gnb";  port = 4043; lookahead = 34560; lead = 1; },
    # the UE's rx-to-tx distance
    # its receiver has the thermal noise of Amber's Reader
    { name = "ue";   port = 4044; lookahead = 17024; lead = 1; noise_counts = 1.0; },
    # amber-tag reads block n, then answers it
    { name = "tag0"; port = 4051; lookahead = 0; },
    { name = "tag1"; port = 4052; lookahead = 0; },
    { name = "tag2"; port = 4053; lookahead = 0; },
    { name = "tag3"; port = 4054; lookahead = 0; },
    # amber-reader --amber.role carrier writes block n, then reads block n
    { name = "cw";   port = 4049; lookahead = 5760; }
  );

  links = (
    # the 5G cell
    { tx = "gnb"; rx = "ue"; },
    { tx = "ue"; rx = "gnb"; },

    # the UE's UL at each Tag, the R2D's "on" chips at the Tag's DC as strong as Amber's Reader's carrier
    { tx = "ue"; rx = "tag0"; gain_dB = 19.13; shift_Hz = -180000.0; },
    { tx = "ue"; rx = "tag1"; gain_dB = 19.13; shift_Hz = -180000.0; },
    { tx = "ue"; rx = "tag2"; gain_dB = 19.13; shift_Hz = -180000.0; },
    { tx = "ue"; rx = "tag3"; gain_dB = 19.13; shift_Hz = -180000.0; },
    # the CW node's carrier at each Tag, as strong as Amber's Reader's there, +0.90 MHz from the Tag's DC
    { tx = "cw"; rx = "tag0"; gain_dB = 0.0; shift_Hz = 900000.0; },
    { tx = "cw"; rx = "tag1"; gain_dB = 0.0; shift_Hz = 900000.0; },
    { tx = "cw"; rx = "tag2"; gain_dB = 0.0; shift_Hz = 900000.0; },
    { tx = "cw"; rx = "tag3"; gain_dB = 0.0; shift_Hz = 900000.0; },
    # each Tag's D2R at the UE, at the level Amber gives it, as from a Tag next to the carrier:
    # only the guard band of the UE's DL (PRBs 25-31), the carrier's reflection at its centre (fs / 2)
    { tx = "tag0"; rx = "ue"; gain_dB = 0.0; shift_Hz = 1980000.0; pass_Hz = 2880000.0; pass_width_Hz = 1260000.0; },
    { tx = "tag1"; rx = "ue"; gain_dB = 0.0; shift_Hz = 1980000.0; pass_Hz = 2880000.0; pass_width_Hz = 1260000.0; },
    { tx = "tag2"; rx = "ue"; gain_dB = 0.0; shift_Hz = 1980000.0; pass_Hz = 2880000.0; pass_width_Hz = 1260000.0; },
    { tx = "tag3"; rx = "ue"; gain_dB = 0.0; shift_Hz = 1980000.0; pass_Hz = 2880000.0; pass_width_Hz = 1260000.0; },
    # the carrier at the D2R receiver, in the same PRBs, as strong as Amber's Reader's own carrier leak
    { tx = "cw"; rx = "ue"; gain_dB = -12.89; shift_Hz = 2880000.0; },
    # the CW node hears that node, and does nothing with it: every node hears someone
    { tx = "ue"; rx = "cw"; }
  );
};

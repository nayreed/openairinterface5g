# SPDX-License-Identifier: LicenseRef-CSSL-1.0
# Written by amber-compose from "/room/scenario.toml"
#
# rfsim_hub room, topology 1: the 25-PRB n28 cell of gnb.conf (gNB) and nr-ue.conf (UE), the gNB
# the Ambient IoT Reader of 4 Tags, all at 5.76 Msps. The gNB sends the R2D in DL PRBs 0-2, a
# CW node the carrier in the UL band, and the gNB receives the D2R in UL PRBs 15-21. The gNB leaves
# those PRBs free (dl_prbblacklist, ul_prbblacklist).
# README.md next to this file explains the gains, and radio/rfsimulator/hub/README.md the parameters.

rfsim_hub = {
  sample_rate = 5760000.0;
  quantum = 1440;
  history = 262144;
  idle_timeout = 60.0;

  nodes = (
    # sl_ahead (6 slots) ahead, and its first write comes after its first read; its receiver
    # has the thermal noise of Amber's Reader
    { name = "gnb";  port = 4043; lookahead = 34560; lead = 1; noise_counts = 1.0; },
    # the UE's rx-to-tx distance
    { name = "ue";   port = 4044; lookahead = 17024; lead = 1; },
    # amber-tag reads block n, then answers it
    { name = "tag0"; port = 4051; lookahead = 0; },
    { name = "tag1"; port = 4052; lookahead = 0; },
    { name = "tag2"; port = 4053; lookahead = 0; },
    { name = "tag3"; port = 4054; lookahead = 0; },
    # amber-reader --amber.role carrier writes block n, then reads block n
    { name = "cw";   port = 4049; lookahead = 5760; }
  );

  links = (
    # the 5G cell
    { tx = "gnb"; rx = "ue"; },
    { tx = "ue"; rx = "gnb"; },

    # the gNB's DL at each Tag, the R2D's "on" chips at the Tag's DC as strong as Amber's Reader's carrier
    { tx = "gnb"; rx = "tag0"; gain_dB = 19.02; shift_Hz = 1980000.0; },
    { tx = "gnb"; rx = "tag1"; gain_dB = 19.02; shift_Hz = 1980000.0; },
    { tx = "gnb"; rx = "tag2"; gain_dB = 19.02; shift_Hz = 1980000.0; },
    { tx = "gnb"; rx = "tag3"; gain_dB = 19.02; shift_Hz = 1980000.0; },
    # the CW node's carrier at each Tag, as strong as Amber's Reader's there, 0.9 MHz under the Tag's DC
    { tx = "cw"; rx = "tag0"; gain_dB = 0.0; shift_Hz = -900000.0; },
    { tx = "cw"; rx = "tag1"; gain_dB = 0.0; shift_Hz = -900000.0; },
    { tx = "cw"; rx = "tag2"; gain_dB = 0.0; shift_Hz = -900000.0; },
    { tx = "cw"; rx = "tag3"; gain_dB = 0.0; shift_Hz = -900000.0; },
    # each Tag's D2R at the gNB, around the carrier's reflection at UL PRB 18's centre, at the level
    # Amber gives it
    { tx = "tag0"; rx = "gnb"; gain_dB = 0.0; shift_Hz = 1980000.0; },
    { tx = "tag1"; rx = "gnb"; gain_dB = 0.0; shift_Hz = 1980000.0; },
    { tx = "tag2"; rx = "gnb"; gain_dB = 0.0; shift_Hz = 1980000.0; },
    { tx = "tag3"; rx = "gnb"; gain_dB = 0.0; shift_Hz = 1980000.0; },
    # the carrier at the gNB, in UL PRB 18, as strong as Amber's Reader's own carrier leak
    { tx = "cw"; rx = "gnb"; gain_dB = -12.89; shift_Hz = 1080000.0; },
    # the CW node hears the gNB, and does nothing with it: every node hears someone
    { tx = "gnb"; rx = "cw"; }
  );
};

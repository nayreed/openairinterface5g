#
# rfsim_hub room: the 25-PRB n28 cell of gnb.band28.u0.25prb.rfsim.dora.conf (gNB and UE) and an
# Ambient IoT Reader with 4 Tags, all at 5.76 Msps. The gNB leaves DL PRBs 0-2 and UL PRBs 15-21
# free (dl_prbblacklist, ul_prbblacklist), and the links put the A-IoT carrier there.
# ci-scripts/yaml_files/5g_rfsimulator_aiot/README.md explains the gains, and
# radio/rfsimulator/hub/README.md the parameters.

rfsim_hub = {
  sample_rate = 5760000.0;
  quantum = 1440;
  history = 262144;
  idle_timeout = 60.0;

  nodes = (
    # sl_ahead (6 slots) ahead, and its first write comes after its first read
    { name = "gnb";    port = 4043; lookahead = 34560; lead = 1; },
    # the UE's rx-to-tx distance
    { name = "ue";     port = 4044; lookahead = 17024; lead = 1; },
    # amber-reader writes block n, then reads block n
    { name = "reader"; port = 4050; lookahead = 5760; },
    # amber-tag reads block n, then answers it
    { name = "tag0";   port = 4051; lookahead = 0; },
    { name = "tag1";   port = 4052; lookahead = 0; },
    { name = "tag2";   port = 4053; lookahead = 0; },
    { name = "tag3";   port = 4054; lookahead = 0; }
  );

  links = (
    # the 5G cell
    { tx = "gnb"; rx = "ue"; },
    { tx = "ue"; rx = "gnb"; },

    # A-IoT: 0 dB, Amber applies its own path loss
    { tx = "reader"; rx = "tag0"; }, { tx = "reader"; rx = "tag1"; },
    { tx = "reader"; rx = "tag2"; }, { tx = "reader"; rx = "tag3"; },
    { tx = "tag0"; rx = "reader"; }, { tx = "tag1"; rx = "reader"; },
    { tx = "tag2"; rx = "reader"; }, { tx = "tag3"; rx = "reader"; },

    # Reader carrier and R2D at the UE, in DL PRBs 0-2 (PRB 1's centre), 10 dB above the 5G DL
    { tx = "reader"; rx = "ue"; gain_dB = -23.0; shift_Hz = -1980000.0; },
    # 5G DL at each Tag, 40 dB below the Reader's carrier there
    { tx = "gnb"; rx = "tag0"; gain_dB = -6.0; shift_Hz = 1980000.0; },
    { tx = "gnb"; rx = "tag1"; gain_dB = -6.0; shift_Hz = 1980000.0; },
    { tx = "gnb"; rx = "tag2"; gain_dB = -6.0; shift_Hz = 1980000.0; },
    { tx = "gnb"; rx = "tag3"; gain_dB = -6.0; shift_Hz = 1980000.0; },
    # each Tag's D2R at the gNB, in UL PRBs 15-21 (PRB 18's centre), 20 dB below the UE's UL
    { tx = "tag0"; rx = "gnb"; gain_dB = -34.0; shift_Hz = 1080000.0; },
    { tx = "tag1"; rx = "gnb"; gain_dB = -34.0; shift_Hz = 1080000.0; },
    { tx = "tag2"; rx = "gnb"; gain_dB = -34.0; shift_Hz = 1080000.0; },
    { tx = "tag3"; rx = "gnb"; gain_dB = -34.0; shift_Hz = 1080000.0; },
    # the Reader's carrier in the UL band, at the gNB, 10 dB above the UE's UL
    { tx = "reader"; rx = "gnb"; gain_dB = -26.0; shift_Hz = 1080000.0; },
    # the UE's UL at the Reader, as strong as a Tag's D2R
    { tx = "ue"; rx = "reader"; gain_dB = 14.0; shift_Hz = -1080000.0; }
  );
};
